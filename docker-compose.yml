
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loomledger-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/loomledger.sqlite
    volumes:
      - ./data:/app/data
      - ./data/raw:/app/data/raw
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: loomledger-postgres
    environment:
      POSTGRES_DB: loomledger
      POSTGRES_USER: loomledger
      POSTGRES_PASSWORD: loomledger_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomledger -d loomledger"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
